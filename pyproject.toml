[project]
name = "venue-booking"
version = "0.1.0"
description = "Book courts on a venue booking site at the daily opening (you solve the captcha, the script does the rest)"
readme = "README.md"
authors = [
    { name = "RTae", email = "natthanan.bhu@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "keyring>=25.7.0",
    "opencv-python-headless>=5.0.0.93",
    "playwright>=1.64.1",
    "pycryptodome>=4.2.0",
    "requests>=2.34.2",
    "typer>=0.27.3",
]

[project.scripts]
venue-booking = "cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "auth",
    "autosolve",
    "booker",
    "browser_login",
    "captcha_desk",
    "cli",
    "client",
    "config",
    "crypto",
    "slots",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
